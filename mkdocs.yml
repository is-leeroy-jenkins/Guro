site_name: Guro
site_description: Prompt and skill engineering library for reusable text, image, and audio AI instruction workflows.
site_url: https://is-leeroy-jenkins.github.io/Guro/
repo_name: is-leeroy-jenkins/Guro
repo_url: https://github.com/is-leeroy-jenkins/Guro

# Build paths
docs_dir: docs
site_dir: site
strict: true

# Material theme
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
  logo: images/guro.png

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - User Guide:
      - Overview: user-guide.md
      - Text Instructions: guides/text.md
      - Image Instructions: guides/image.md
      - Audio Instructions: guides/audio.md
      - Discovery & Dynamic Lookup: guides/discovery.md
      - Integrating with LLM APIs: guides/integration.md
      - Choosing the Right Module: guides/module-selection.md
  - Prompt Catalog:
      - Catalog Overview: reference/catalog.md
      - Categories & Routing: reference/categories.md
  - API Reference:
      - Overview: api/index.md
      - Unified Package: api/package.md
      - Text Module: api/text.md
      - Image Module: api/image.md
      - Audio Module: api/audio.md
  - Development:
      - Overview: development/index.md
      - Adding or Updating Prompts: development/adding-prompts.md
      - Category Routing: development/category-routing.md
      - Testing & Validation: development/testing.md
      - Documentation Workflow: development/documentation.md
  - Troubleshooting: troubleshooting.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true

extra_css:
  - stylesheets/guro.css

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

watch:
  - instructions
